[tool.poetry]
name = "caios-backend"
version = "0.1.0"
description = "CAIOS (Crypto AI Investment Operating System) backend"
authors = ["AI Architect"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
supabase = "^2.4.0"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.29"}
alembic = "^1.13.1"
redis = {extras = ["hiredis"], version = "^5.0.3"}
openai = "^1.16.2"
anthropic = "^0.21.3"
python-telegram-bot = {extras = ["all"], version = "^20.8"}
httpx = "^0.27.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
pandas = "^2.2.1"
numpy = "^1.26.4"
ta = "^0.11.0"
python-dotenv = "^1.0.1"
loguru = "^0.7.2"
prometheus-fastapi-instrumentator = "^7.0.0"
tenacity = "^8.2.3"
aiofiles = "^23.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
black = "^24.3.0"
ruff = "^0.3.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
